<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitCalc — план тренировки</title>
    <style>
        body { margin: 0; color: #182f2a; background: #f1f5f2; font: 1rem/1.55 system-ui, sans-serif; }
        main { box-sizing: border-box; max-width: 42rem; margin: 8vh auto; padding: 0 1rem; }
        h1 { font-size: 2.5rem; margin: 0 0 1rem; }
        section, form { padding: 1.5rem; margin-block: 1rem; border-radius: 1rem; background: white; }
        label { display: block; font-weight: 600; }
        select, button { margin-top: .5rem; padding: .55rem .8rem; border-radius: .5rem; font: inherit; }
        select { border: 1px solid #61746c; background: white; }
        button { border: 1px solid #205a46; background: #205a46; color: white; cursor: pointer; }
        [role="alert"] { color: #9a2727; }
        h2 { margin-top: 0; }
    </style>
</head>
<body>
    <main>
        <h1>FitCalc</h1>
        <form method="post" action="{{ request.url_for('show_plan').path }}">
            <label for="level">Уровень подготовки</label>
            <select id="level" name="level" required>
                {% for level, label in levels.items() %}
                <option value="{{ level.value }}"{% if level == selected_level %} selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <button type="submit">Получить план</button>
            {% if error %}<p role="alert">{{ error }}</p>{% endif %}
        </form>
        {% if plan %}
        <section aria-labelledby="plan-title">
            <h2 id="plan-title">План тренировки</h2>
            <p>Уровень — {{ levels[selected_level] }}. Условная интенсивность — {{ "%.0f"|format(plan.intensity * 100) }}%.</p>
            <ol>
                {% for exercise in plan.exercises %}<li>{{ exercise }}</li>{% endfor %}
            </ol>
        </section>
        {% endif %}
    </main>
</body>
</html>
